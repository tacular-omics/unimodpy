# Standard tacular-omics CI. Canonical copy: tacular-omics workspace templates/.
# Package-specific jobs (docs, paper, extras matrices) live in separate workflow
# files or are appended below the standard jobs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run ty check src
      - run: python scripts/release_version.py check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run pytest tests

  # Proves the declared lower bounds still work: installs the oldest allowed
  # version of every direct dependency.
  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --resolution lowest-direct --all-extras --all-groups
      # --no-sync is required: a plain `uv run` re-resolves to the default (highest)
      # versions and silently undoes the lowest-direct sync above.
      - run: uv run --no-sync pytest tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - run: python scripts/release_version.py check --dist dist
      - name: Check the bundled UNIMOD.obo data file made it into the wheel
        run: |
          python -c "
          import glob, sys, zipfile
          for wheel in glob.glob('dist/*.whl'):
              names = [n for n in zipfile.ZipFile(wheel).namelist() if n.endswith('.obo')]
              if not names:
                  sys.exit(f'{wheel} is missing the bundled UNIMOD.obo data file')
              print(wheel, names)
          "
      - name: Import the built wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          pkg=$(python -c "import tomllib;print(tomllib.load(open('${{ github.workspace }}/pyproject.toml','rb'))['project']['name'].replace('-','_'))")
          uv run --isolated --no-project --with "$(ls ${{ github.workspace }}/dist/*.whl)" python -c "import $pkg; print($pkg.__version__)"

  # Package-specific: branch coverage uploaded to Codecov. Report only, no threshold.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run pytest tests --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tacular-omics/unimodpy
          files: coverage.xml
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tacular-omics/unimodpy
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: false

  # Same hooks contributors run at commit time (.pre-commit-config.yaml).
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  # Package-specific: the Vercel deploy surface (vercel.json, api/index.py). Nothing else here
  # reads either file, and the two defects recorded in CLAUDE.md that reached production through
  # them - a missing installCommand (500, ModuleNotFoundError: fastapi) and a catch-all rewrite
  # (404) - change nothing under src/, so no other job can see them. This one builds its
  # environment from installCommand itself rather than reading it, so deleting that line fails
  # here with the same ModuleNotFoundError it would put in production.
  deploy-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 3.12 because that is the interpreter the deploy actually uses, and it is the
      # requires-python floor rather than the newest Python this repository tests. Measured on
      # this repository's production deployment dpl_HnKaJtDFfdHALH4FZqrsX6YydLrG (commit
      # f63880e): the Vercel build log says "Using Python 3.12 from pyproject.toml", "Writing
      # .python-version file with version 3.12", then "Using Python 3.12.15 environment at:
      # .vercel/python/.venv". Pinned here and asserted against the pyproject by
      # `test_the_job_builds_on_the_python_vercel_picks`, so a requires-python bump cannot leave
      # this job behind on the old interpreter in silence.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install exactly what vercel.json's installCommand installs
        run: |
          uv venv
          export VIRTUAL_ENV="$PWD/.venv"
          command=$(python -c "import json; print(json.load(open('vercel.json')).get('installCommand', 'uv pip install .'))")
          echo "installCommand: $command"
          eval "$command"
          uv pip install pytest
      - name: Import api/index.py and check the files vercel.json promises
        run: .venv/bin/python -m pytest -q tests/test_deploy_surface.py
        env:
          UNIMODPY_REQUIRE_DEPLOY_SURFACE: "1"
